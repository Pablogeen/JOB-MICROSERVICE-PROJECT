server.port=5888
spring.application.name=GATEWAY


spring.cloud.gateway.server.webflux.routes[0].id=job-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://JOB-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v1/jobs/**


spring.cloud.gateway.server.webflux.routes[1].id=company-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://COMPANY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/v1/companies/**


spring.cloud.gateway.server.webflux.routes[2].id=review-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://REVIEW-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/v1/reviews/**


spring.cloud.gateway.server.webflux.routes[3].id=eureka-server
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/


spring.cloud.gateway.server.webflux.routes[4].id=eureka-server-static
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/eureka/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/


#Eureka
eureka.client.serviceUrl.defaultZone= http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#Zipkin
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0